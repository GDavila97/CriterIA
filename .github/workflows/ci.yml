name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Workflow and script lint
    runs-on: ubuntu-24.04
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: Actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'
      # The release scripts run by hand against production; the runner image ships shellcheck.
      - name: Shellcheck
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh services/api/scripts/*.sh apps/web/scripts/*.sh

  api:
    name: API
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: criteria
          POSTGRES_PASSWORD: criteria
          POSTGRES_DB: criteria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U criteria -d criteria_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes only full version tags since v8, so there is no moving major tag.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: services/api/pyproject.toml
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Unit tests
        run: uv run pytest -m "not integration and not ollama"
      # The whole suite again against the Postgres service; coverage counts both kinds.
      - name: Unit and integration tests
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://criteria:criteria@localhost:5432/criteria_test
        run: uv run pytest
      - name: Contract is up to date
        run: uv run criteria-contract --check
      - name: Pip-audit
        run: |
          uv export --frozen --format requirements-txt --no-emit-project --quiet --output-file "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

  web:
    name: Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: Prettier check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: API types match the contract
        run: |
          pnpm gen:api
          git diff --exit-code -- src/shared/api/types.gen.ts
      - name: Vitest
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Pnpm audit
        run: pnpm audit --audit-level=moderate

  e2e:
    name: End to end
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: criteria
          POSTGRES_PASSWORD: criteria
          POSTGRES_DB: criteria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U criteria -d criteria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports:
          - 1025:1025
          - 8025:8025
    env:
      E2E_DATABASE_ADMIN_URL: postgresql://criteria:criteria@localhost:5432/criteria
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: services/api/pyproject.toml
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - name: Install API dependencies
        working-directory: services/api
        run: uv sync --frozen
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the web for the end-to-end servers
        run: pnpm e2e:build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      # The API runs on fake models and GitHub is a local stub: nothing leaves the runner.
      - name: Playwright with axe
        run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: API image
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: criteria
          POSTGRES_PASSWORD: criteria
          POSTGRES_DB: criteria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U criteria -d criteria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_URL: postgresql://criteria:criteria@localhost:5432/criteria
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: services/api
          push: false
          load: true
          tags: criteria-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create roles and run the migrations from the image
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "ROLE_PASSWORD=$password" >> "$GITHUB_ENV"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f services/api/db/roles.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q \
            -c "ALTER ROLE migrator_role PASSWORD '$password'" \
            -c "ALTER ROLE api_role PASSWORD '$password'"
          # Stands in for the Better Auth migrations: migration 0004 references auth."user".
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q \
            -c "SET ROLE web_role" \
            -c 'CREATE TABLE auth."user" (id text PRIMARY KEY)'
          docker run --rm --network host \
            -e MIGRATION_DATABASE_URL="postgresql://migrator_role:$password@localhost:5432/criteria" \
            criteria-api:ci alembic upgrade head
      - name: Smoke test the container
        run: |
          docker run -d --name api --network host \
            -e APP_ENV=test -e PORT=9000 \
            -e DATABASE_URL="postgresql://api_role:$ROLE_PASSWORD@localhost:5432/criteria" \
            -e WEB_ORIGIN=http://localhost:3000 \
            -e AUTH_JWKS_URL=http://localhost:3000/api/auth/jwks \
            -e AUTH_ISSUER=http://localhost:3000 \
            -e AUTH_AUDIENCE=http://localhost:3000 \
            -e CREDENTIALS_KEYS="1:$(openssl rand -base64 32)" \
            -e CREDENTIALS_ACTIVE_KEY=1 \
            criteria-api:ci
          # uvicorn needs a moment before it listens; until then the connection is refused.
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:9000/healthz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:9000/me/settings)" = "401"
          test "$(docker exec api id -u)" != "0"
      - name: Container logs
        if: failure()
        run: docker logs api || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      # Scanning the whole history avoids a commit range, which breaks on the root commit.
      - name: Scan full history
        run: >-
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1
          --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif" .
      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-sarif
          path: ${{ runner.temp }}/gitleaks.sarif
          retention-days: 7
