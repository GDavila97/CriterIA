version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ['*']

  - package-ecosystem: uv
    directory: /services/api
    schedule:
      interval: weekly
    groups:
      api:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /services/api
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']
