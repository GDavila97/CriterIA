version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ['*']
    # Majors blocked until typescript-eslint supports TypeScript 7 and the Next.js ESLint plugins support ESLint 10.
    ignore:
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: uv
    directory: /services/api
    schedule:
      interval: weekly
    groups:
      api:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /services/api
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']
