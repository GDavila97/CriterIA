# Models each provider may run, with prices in USD per million tokens.
# Prices are copied by hand from each provider's price list (verified 2026-11-04). A model without
# both prices reports its cost as null. openai_compatible accepts any model name the user brings.
# A tier (nivel) resolves to the first model listed with it for that provider.

[[models]]
provider = "openai"
name = "gpt-5.4-mini"
nivel = "economico"
input_usd_per_million = 0.75
output_usd_per_million = 4.50

[[models]]
provider = "openai"
name = "gpt-5.5"
nivel = "equilibrado"

[[models]]
provider = "openai"
name = "gpt-5.5-pro"
nivel = "maximo"

# Rate for prompts up to 100,000 tokens; CriterIA prompts stay far below that.
[[models]]
provider = "anthropic"
name = "claude-haiku-5-5"
nivel = "economico"
input_usd_per_million = 0.10
output_usd_per_million = 0.50

[[models]]
provider = "anthropic"
name = "claude-sonnet-5-5"
nivel = "equilibrado"

[[models]]
provider = "anthropic"
name = "claude-opus-5-5"
nivel = "maximo"

# Groq runs on the free plan.
[[models]]
provider = "groq"
name = "openai/gpt-oss-20b"
nivel = "economico"
input_usd_per_million = 0.0
output_usd_per_million = 0.0

[[models]]
provider = "groq"
name = "llama-3.3-70b-versatile"
nivel = "economico"
input_usd_per_million = 0.0
output_usd_per_million = 0.0

# Local models have no API charge.
[[models]]
provider = "ollama"
name = "qwen3:8b"
thinking = false
input_usd_per_million = 0.0
output_usd_per_million = 0.0

[[models]]
provider = "ollama"
name = "llama3.1:8b"
input_usd_per_million = 0.0
output_usd_per_million = 0.0

# Typical tokens per run for each agent, used to estimate a run's cost before it starts.
# Provisional values; calibrated in F2b with the median of the local selection runs.
[consumption_profile.analista]
input_tokens = 1500
output_tokens = 900

[consumption_profile.qa]
input_tokens = 2500
output_tokens = 3500

[consumption_profile.revisor]
input_tokens = 5000
output_tokens = 900

[consumption_profile.evaluador]
input_tokens = 5500
output_tokens = 600
