# Models each provider may run, with prices in USD per million tokens.
# Prices are copied by hand from each provider's price list (verified 2026-11-05). A model without
# both prices reports its cost as null. openai_compatible accepts any model name the user brings.
# Each provider has at most one model per tier (nivel); the catalog refuses to load otherwise.
# display_name is what the interface shows next to the provider, such as "Groq · GPT-OSS 20B".

[[models]]
provider = "openai"
name = "gpt-6-luna"
display_name = "GPT-6 Luna"
nivel = "economico"
input_usd_per_million = 0.10
output_usd_per_million = 0.50

[[models]]
provider = "openai"
name = "gpt-6.1-sol"
display_name = "GPT-6.1 Sol"
nivel = "equilibrado"
input_usd_per_million = 2.0
output_usd_per_million = 10.0

[[models]]
provider = "openai"
name = "gpt-6-astra"
display_name = "GPT-6 Astra"
nivel = "maximo"
input_usd_per_million = 10.0
output_usd_per_million = 50.0

# Kept for explicit selection; no tier resolves to it.
[[models]]
provider = "openai"
name = "gpt-5.4-mini"
display_name = "GPT-5.4 mini"
input_usd_per_million = 0.75
output_usd_per_million = 4.50

# Rate for prompts up to 100,000 tokens; CriterIA prompts stay far below that.
[[models]]
provider = "anthropic"
name = "claude-haiku-5-5"
display_name = "Claude Haiku 5.5"
nivel = "economico"
input_usd_per_million = 0.10
output_usd_per_million = 0.50

[[models]]
provider = "anthropic"
name = "claude-sonnet-5-5"
display_name = "Claude Sonnet 5.5"
nivel = "equilibrado"
input_usd_per_million = 2.0
output_usd_per_million = 10.0

[[models]]
provider = "anthropic"
name = "claude-opus-5-5"
display_name = "Claude Opus 5.5"
nivel = "maximo"
input_usd_per_million = 4.0
output_usd_per_million = 20.0

# Groq Developer plan (ADR 0019). Prices verified on Groq's price page (2026-11-08); the cached
# input price (0.037) is not modelled.
[[models]]
provider = "groq"
name = "openai/gpt-oss-20b"
display_name = "GPT-OSS 20B"
nivel = "economico"
# Native JSON output: with tool calls it names the tool "functions.final_result" (ADR 0021).
output_mode = "native"
input_usd_per_million = 0.075
output_usd_per_million = 0.30

# Its reasoning tokens make it spend far more than the general profile. Medians of the 14 complete
# runs of its native v1 batch with a 16,384 cap (eval/results/v1, 2026-11-10).
[models.consumption_profile.analista]
input_tokens = 880
output_tokens = 1290

[models.consumption_profile.qa]
input_tokens = 8253
output_tokens = 8870

[models.consumption_profile.revisor]
input_tokens = 9318
output_tokens = 10854

# Local models have no API charge.
# Default local model, chosen in F2b (docs/evaluation.md, "Selección del modelo local").
[[models]]
provider = "ollama"
name = "llama3.1:8b"
# 16,384 tokens of context: a 6,652-token prompt plus 16,384 of output would not fit.
max_tokens = 8192
display_name = "Llama 3.1 8B"
# Schema-constrained JSON instead of a tool call; local models often skip or reshape tool calls.
output_mode = "native"
input_usd_per_million = 0.0
output_usd_per_million = 0.0

[[models]]
provider = "ollama"
name = "qwen3:8b"
# 16,384 tokens of context: a 6,652-token prompt plus 16,384 of output would not fit.
max_tokens = 8192
display_name = "Qwen3 8B"
thinking = false
output_mode = "native"
input_usd_per_million = 0.0
output_usd_per_million = 0.0

# Typical tokens per run for each agent (all rounds and retries), used to estimate a run's cost
# before it starts. Medians of the five complete F2b runs with native output (2026-11-05).
[consumption_profile.analista]
input_tokens = 2995
output_tokens = 1301

[consumption_profile.qa]
input_tokens = 6631
output_tokens = 4894

[consumption_profile.revisor]
input_tokens = 8071
output_tokens = 1057

[consumption_profile.evaluador]
input_tokens = 5605
output_tokens = 819
