# Local development database. Production uses Neon (F6); CI uses its own Postgres service.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: criteria
      POSTGRES_PASSWORD: criteria
      POSTGRES_DB: criteria
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U criteria -d criteria"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
