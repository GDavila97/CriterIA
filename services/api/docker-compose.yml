# Local development services. Production uses Neon (F6); CI uses its own service containers.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: criteria
      POSTGRES_PASSWORD: criteria
      POSTGRES_DB: criteria
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U criteria -d criteria"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
  # Catches the web's email in development and in the end-to-end tests (EMAIL_PROVIDER=smtp).
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
